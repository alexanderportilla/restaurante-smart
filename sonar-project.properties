sonar.projectKey=restaurante-smart
sonar.projectName=Restaurante Smart
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src/test

sonar.exclusions=**/.venv/**,**/node_modules/**,**/dist/**,**/coverage/**,**/__pycache__/**,**/*.pyc,frontend/src/test/**
sonar.test.exclusions=**/.venv/**,**/node_modules/**,**/dist/**,**/coverage/**,**/__pycache__/**,**/*.pyc

sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
