services:
  # ============================================================================
  # PERFIL: app (Aplicación Restaurante Smart + PostgreSQL independiente)
  # ============================================================================
  postgres-app:
    image: postgres:17.12-alpine3.24
    container_name: postgres-app
    profiles: ["app"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-restaurante_smart}
      POSTGRES_USER: ${APP_DB_USER:-restaurante_user}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD requerido en .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
    ports:
      - "127.0.0.1:${APP_DB_PORT:-5432}:5432"
    volumes:
      - postgres_app_data:/var/lib/postgresql/data
    networks:
      - app_network
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-restaurante_user} -d ${APP_DB_NAME:-restaurante_smart}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: restaurante-smart-backend:1.0.0
    container_name: restaurante-smart-backend
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      postgres-app:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_DB_HOST: postgres-app
      APP_DB_PORT: 5432
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      - app_network
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: restaurante-smart-frontend:1.0.0
    container_name: restaurante-smart-frontend
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    networks:
      - app_network
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # PERFIL: quality (SonarQube Community Build + PostgreSQL exclusivo)
  # ============================================================================
  postgres-sonar:
    image: postgres:17.12-alpine3.24
    container_name: postgres-sonar
    profiles: ["quality"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME:-sonarqube}
      POSTGRES_USER: ${SONAR_DB_USER:-sonar_user}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD requerido en .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
    volumes:
      - postgres_sonar_data:/var/lib/postgresql/data
    networks:
      - devops_network
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar_user} -d ${SONAR_DB_NAME:-sonarqube}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sonarqube:
    image: sonarqube:26.11.0.134175-community
    container_name: restaurante-smart-sonarqube
    profiles: ["quality"]
    restart: unless-stopped
    depends_on:
      postgres-sonar:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/${SONAR_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar_user}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD requerido en .env}
      SONAR_WEB_JAVAOPTS: "-Xms256m -Xmx768m"
      SONAR_CE_JAVAOPTS: "-Xms256m -Xmx1024m"
      SONAR_SEARCH_JAVAOPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - devops_network
    mem_limit: 4096m
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ============================================================================
  # PERFIL: ci (Jenkins LTS JDK 21 + Agente aislado sin docker.sock — Opción B)
  # ============================================================================
  jenkins:
    image: jenkins/jenkins:2.580.2-lts-jdk21
    container_name: restaurante-smart-jenkins
    profiles: ["ci"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true -Xms256m -Xmx768m -XX:+UseG1GC"
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
      - "127.0.0.1:${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - devops_network
    mem_limit: 1536m
    cpus: "1.5"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  jenkins-agent:
    build:
      context: ./jenkins/agent
      dockerfile: Dockerfile
    image: restaurante-smart-jenkins-agent:jdk21
    container_name: restaurante-smart-jenkins-agent
    profiles: ["ci"]
    restart: unless-stopped
    depends_on:
      jenkins:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      JENKINS_URL: "http://restaurante-smart-jenkins:8080"
      JENKINS_WEB_SOCKET: "true"
      JENKINS_AGENT_NAME: "restaurante-smart-agent"
      JENKINS_AGENT_WORKDIR: "/home/jenkins/agent"
      JENKINS_SECRET: "${JENKINS_AGENT_SECRET:-}"
    volumes:
      - jenkins_agent_data:/home/jenkins/agent
      - ./.ci-workspace:/workspace/restaurante-smart:ro
    networks:
      - devops_network
    mem_limit: 1536m
    cpus: "1.5"
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'agent.jar' /proc/[0-9]*/cmdline || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ============================================================================
  # PERFIL: ops (Portainer CE LTS — retirado temporalmente tras auditoría Fase 12)
  # La incorporación de Portainer queda aplazada hasta contar con proxy de socket
  # endurecido y sin acceso directo a /var/run/docker.sock.
  # ============================================================================

networks:
  app_network:
    name: app_network
    external: true
  devops_network:
    name: devops_network
    driver: bridge

volumes:
  postgres_app_data:
    name: postgres_app_data
    external: true
  postgres_sonar_data:
    name: postgres_sonar_data
  sonarqube_data:
    name: sonarqube_data
  sonarqube_logs:
    name: sonarqube_logs
  sonarqube_extensions:
    name: sonarqube_extensions
  jenkins_home:
    name: jenkins_home
  jenkins_agent_data:
    name: jenkins_agent_data
